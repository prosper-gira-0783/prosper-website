```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUST - Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="must-logo.png" alt="MUST Logo" class="must-logo">
        <h1>MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h1>
        <p class="subtitle">Online Application Portal</p>
    </header>

    <main>
        <div class="login-container">
            <h2>Create Account</h2>
            <p class="description">
                Enter your details to create an account.
            </p>

            <form action="#" method="post">
                <label for="fullname">Full Name</label>
                <div class="input-container">
                    <input type="text" id="fullname" name="fullname"
                           placeholder="Enter your full name" required>
                </div>

                <label for="email">Email Address</label>
                <div class="input-container">
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email address" required>
                </div>

                <label for="phone">Phone Number</label>
                <div class="input-container">
                    <input type="tel" id="phone" name="phone"
                           placeholder="Enter your phone number" required>
                </div>

                <label for="password">Password</label>
                <div class="input-container">
                    <input type="password" id="password" name="password"
                           placeholder="Create a password" required>
                </div>

                <label for="confirm-password">Confirm Password</label>
                <div class="input-container">
                    <input type="password" id="confirm-password"
                           name="confirm-password"
                           placeholder="Enter your password again" required>
                </div>

                <button type="submit">Create Account</button>
            </form>

            <p class="signup-link">
                Already have an account?
                <a href="login.html">Sign In</a>
            </p>

            <div class="portal-buttons">
                <a href="how_to_apply.html" class="portal-button">
                    How to Apply
                </a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Mbarara University of Science and Technology.</p>
    </footer>

</body>
</html>
```
